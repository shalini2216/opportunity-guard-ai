services:
  # Python Flask Backend Web Service
  - type: web
    name: opportunityguard-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt gunicorn"
    startCommand: "cd backend && gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 'app:create_app()'"
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: opportunity_guard
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false

  # React Vite Frontend Static Site
  - type: web
    name: opportunityguard-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
