version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: opportunityguard-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: opportunity_guard

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opportunityguard-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/opportunity_guard
      - DB_NAME=opportunity_guard
      - SECRET_KEY=${SECRET_KEY:-opportunity-guard-super-secret-key-prod}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-opportunity-guard-jwt-key-prod}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID:-}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET:-}
      - GMAIL_REDIRECT_URI=${GMAIL_REDIRECT_URI:-http://localhost:5000/api/email/oauth/callback}
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opportunityguard-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
